
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    
    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Art AI" />
    
    <title>Art AI - Tech Art Viz</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar to match UE5 aesthetic */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0"
  }
}
</script>
<link rel="stylesheet" href="./index.css">
</head>
  <body class="bg-zinc-950 text-zinc-100 antialiased overscroll-none">
    <div id="root"></div>
    <script>
      // Service Worker registration removed to prevent origin mismatch errors in preview environments
      // and ensure direct network access for API calls.
      if ('serviceWorker' in navigator) {
         try {
           navigator.serviceWorker.getRegistrations()
             .then(function(registrations) {
               for(let registration of registrations) {
                 registration.unregister();
               } 
             })
             .catch(function(err) {
               console.warn("ServiceWorker cleanup skipped:", err);
             });
         } catch (e) {
           console.warn("ServiceWorker unavailable:", e);
         }
      }
    </script>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
